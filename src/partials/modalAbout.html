<div class="modal__backdrop" id="modalAbout" aria-hidden="true">
  <div
    class="modal__about"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalAboutTitle"
  >
    <button class="modal__close" type="button" aria-label="{{t:partial.about.close}}">
      &times;
    </button>

    <div class="modal__header modal__header--about">
      <h2 class="modal__title" id="modalAboutTitle">{{t:partial.nav.about}}</h2>
      <p class="modal__text">
        {{t:partial.about.description}}
      </p>
    </div>

    <div class="modal__about-content">
      <p class="modal__about-lead">
        {{t:partial.about.lead}}
      </p>

      <div class="modal__about-copy">
        <p>
          {{t:partial.about.materials}}
        </p>
        <p>
          {{t:partial.about.approach}}
        </p>
        <p>
          {{t:partial.about.quality}}
        </p>
        <p>
          {{t:partial.about.goal}}
        </p>
        <p>
          {{t:partial.about.invitation}}
        </p>
      </div>

      <div class="modal__about-note" aria-label="{{t:partial.about.serviceArea}}">
        <span class="modal__about-note-icon" aria-hidden="true">📍</span>
        <p>
          {{t:partial.about.history}}
        </p>
      </div>
    </div>
  </div>
</div>
