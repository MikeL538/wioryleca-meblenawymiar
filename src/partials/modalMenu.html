<div class="modal__backdrop" id="modalMenu" aria-hidden="true">
  <div
    class="modal__menu"
    aria-modal="true"
    role="dialog"
    aria-label="{{t:partial.menu.title}}"
  >
    <button class="modal__close" type="button" aria-label="{{t:partial.menu.close}}">
      &times;
    </button>

    <a class="header__link" href="/">
      <img class="modal__menu-image" src="/logos.png" alt="{{t:partial.brand.logoAlt}}" />
    </a>

    <nav class="mobile__nav">
      <ul class="mobile__nav-list">
        <li class="mobile__nav-list-item">
          <a href="/" class="mobile__nav-list-link">{{t:partial.nav.home}}</a>
        </li>
        <li class="mobile__nav-list-item">
          <a
            href="/projects.html?category=kitchen"
            class="mobile__nav-list-link"
          >
            {{t:partial.nav.projects}}
          </a>
        </li>
        <li class="mobile__nav-list-item">
          <button
            type="button"
            class="mobile__nav-list-link"
            data-modal-open="coop"
          >
            {{t:partial.nav.cooperation}}
          </button>
        </li>
        <li class="mobile__nav-list-item">
          <button
            type="button"
            class="mobile__nav-list-link"
            data-modal-open="about"
          >
            {{t:partial.nav.about}}
          </button>
        </li>
        <li class="mobile__nav-list-item">
          <button
            class="mobile__nav-list-link"
            data-modal-open="contact"
            type="button"
          >
            {{t:partial.nav.contact}}
          </button>
        </li>
      </ul>
    </nav>
    {{languageSwitcher}}
  </div>
</div>
